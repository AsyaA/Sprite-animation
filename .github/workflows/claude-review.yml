name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Get changed files
        id: files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }})
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Review each file with Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          touch comments.txt

          for file in ${{ steps.files.outputs.files }}
          do
            echo "Reviewing $file"

            DIFF=$(git diff origin/${{ github.base_ref }} -- "$file" | head -c 8000)

            # Skip empty diffs
            if [ -z "$DIFF" ]; then
              continue
            fi

            # Escape JSON safely using jq
            PAYLOAD=$(jq -n \
              --arg diff "$DIFF" \
              --arg file "$file" \
              '{
                model: "claude-3-sonnet-20240229",
                max_tokens: 500,
                messages: [
                  {
                    role: "user",
                    content: "You are a strict senior engineer. Review ONLY this file diff.\n\nRules:\n- Only report real issues\n- No generic advice\n- Be specific and actionable\n- If no issues, say \"No issues found\"\n\nFile: \($file)\n\nDiff:\n\($diff)"
                  }
                ]
              }')

            RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
              -H "x-api-key: $CLAUDE_API_KEY" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "$PAYLOAD")

            COMMENT=$(echo "$RESPONSE" | jq -r '.content[0].text // "Error: no response"')

            echo "### $file" >> comments.txt
            echo "$COMMENT" >> comments.txt
            echo "" >> comments.txt
          done

      - name: Post summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f comments.txt ]; then
            echo "No comments to post"
            exit 0
          fi

          BODY=$(jq -Rs . < comments.txt)

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $BODY}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
