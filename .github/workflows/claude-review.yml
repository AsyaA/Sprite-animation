name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR with Claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref }}"
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo '[]' > all_comments.json
          SUMMARY=""

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE")
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files to review"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES; do
            echo "::group::Reviewing $file"

            DIFF=$(git diff "$BASE" -- "$file")

            if echo "$DIFF" | grep -q "^Binary files"; then
              echo "Skipping binary file"
              echo "::endgroup::"
              continue
            fi
            if [ -z "$DIFF" ]; then
              echo "Empty diff, skipping"
              echo "::endgroup::"
              continue
            fi

            VALID_LINES=$(echo "$DIFF" | awk '
              /^@@ / {
                s = $3
                sub(/^\+/, "", s)
                sub(/,.*/, "", s)
                line = s + 0
                next
              }
              /^\+/ { print line; line++; next }
              /^-/  { next }
              /^ /  { line++; next }
            ' | sort -nu | tr '\n' ',' | sed 's/,$//')

            if [ -z "$VALID_LINES" ]; then
              echo "No added lines to comment on"
              echo "::endgroup::"
              continue
            fi

            echo "Valid lines: $VALID_LINES"

            ANNOTATED=$(echo "$DIFF" | awk '
              /^@@ / {
                s = $3
                sub(/^\+/, "", s)
                sub(/,.*/, "", s)
                line = s + 0
                print $0
                next
              }
              /^\+/ {
                printf "[L%d] +%s\n", line, substr($0, 2)
                line++
                next
              }
              /^-/ {
                printf "      -%s\n", substr($0, 2)
                next
              }
              /^ / {
                printf "[L%d]  %s\n", line, substr($0, 2)
                line++
                next
              }
            ')
            ANNOTATED="${ANNOTATED:0:6000}"

            if [ -z "$ANNOTATED" ]; then
              echo "Annotated diff empty, skipping"
              echo "::endgroup::"
              continue
            fi

            # Build the API request body via jq to safely escape all strings
            REQUEST_BODY=$(jq -n \
              --arg file "$file" \
              --arg valid "$VALID_LINES" \
              --arg annotated "$ANNOTATED" \
              '{
                model: "claude-sonnet-4-20250514",
                max_tokens: 1024,
                messages: [{
                  role: "user",
                  content: ("You are a senior code reviewer. Review this diff and provide inline comments.\n\nFile: " + $file + "\nValid line numbers you may reference: " + $valid + "\n\nAnnotated diff (line numbers shown as [L<num>]):\n" + $annotated + "\n\nRespond with ONLY valid JSON (no markdown code fences, no extra text). Format:\n{\"summary\":\"Brief summary of changes\",\"comments\":[{\"line\":<number>,\"body\":\"Your review comment\"}]}\n\nRules:\n- ONLY use line numbers from the valid-lines list above.\n- Focus on bugs, security issues, performance problems, and error-handling gaps.\n- Skip trivial style nitpicks.\n- If the code looks good, return an empty comments array.")
                }]
              }')

            echo "Calling Claude API..."
            HTTP_STATUS=$(curl -s -o api_response.json -w "%{http_code}" \
              https://api.anthropic.com/v1/messages \
              -H "x-api-key: $CLAUDE_API_KEY" \
              -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "$REQUEST_BODY")

            echo "API HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "API error for $file:"
              cat api_response.json
              echo "::endgroup::"
              continue
            fi

            # Check for API-level error in the response body
            API_ERROR=$(jq -r '.error.message // empty' api_response.json)
            if [ -n "$API_ERROR" ]; then
              echo "API returned error: $API_ERROR"
              echo "::endgroup::"
              continue
            fi

            TEXT=$(jq -r '.content[0].text // empty' api_response.json)
            if [ -z "$TEXT" ]; then
              echo "No text in API response:"
              cat api_response.json
              echo "::endgroup::"
              continue
            fi

            echo "Raw Claude response:"
            echo "$TEXT"

            # Extract JSON from the response, handling optional code fences
            # and any surrounding text
            CLEANED=$(echo "$TEXT" | sed '/^```/d')
            JSON=$(echo "$CLEANED" | jq '.' 2>/dev/null) || true
            if [ -z "$JSON" ]; then
              # Try extracting JSON object from mixed text
              JSON=$(echo "$CLEANED" | grep -Pzo '\{[\s\S]*\}' | tr '\0' '\n' | jq '.' 2>/dev/null) || true
            fi
            if [ -z "$JSON" ]; then
              echo "Failed to parse JSON from response"
              echo "::endgroup::"
              continue
            fi

            echo "Parsed JSON successfully"

            FILE_SUMMARY=$(echo "$JSON" | jq -r '.summary // empty')
            if [ -n "$FILE_SUMMARY" ]; then
              SUMMARY="${SUMMARY}- **${file}**: ${FILE_SUMMARY}\n"
            fi

            COMMENT_JSON=$(echo "$JSON" | jq --arg path "$file" --arg valid "$VALID_LINES" '
              (if $valid == "" then [] else ($valid | split(",") | map(tonumber)) end) as $vlines |
              [.comments // [] | .[]
                | select(.line and .body and ((.line | tonumber) as $l | $vlines | index($l)))
                | {path: $path, line: (.line | tonumber), side: "RIGHT", body: .body}]
            ' 2>/dev/null) || true

            if [ -z "$COMMENT_JSON" ] || [ "$COMMENT_JSON" = "null" ]; then
              echo "No valid inline comments for $file"
              echo '[]' > file_comments.json
            else
              echo "$COMMENT_JSON" > file_comments.json
              echo "Filtered comments for $file:"
              cat file_comments.json
            fi

            jq -s '.[0] + .[1]' all_comments.json file_comments.json > merged.json
            mv merged.json all_comments.json

            echo "::endgroup::"
          done

          echo "=== Final results ==="
          echo "Summary: $SUMMARY"
          echo "All comments:"
          cat all_comments.json

          COMMENT_COUNT=$(jq 'length' all_comments.json)

          if [ -n "$SUMMARY" ]; then
            REVIEW_BODY=$(printf "## Claude Review\n\n%b" "$SUMMARY")
          else
            REVIEW_BODY="## Claude Review\n\nNo significant issues found."
          fi

          if [ "$COMMENT_COUNT" -gt 0 ]; then
            echo "Posting review with $COMMENT_COUNT inline comment(s)"

            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg body "$REVIEW_BODY" \
                --argjson comments "$(cat all_comments.json)" \
                '{body: $body, event: "COMMENT", comments: $comments}')" \
              "https://api.github.com/repos/$REPO/pulls/$PR/reviews")

            echo "Review API HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Inline review failed, response:"
              cat response.json
              echo ""
              echo "Falling back to issue comment"

              FALLBACK="$REVIEW_BODY\n\n### Inline Comments\n"
              while IFS= read -r c; do
                cpath=$(echo "$c" | jq -r '.path')
                cline=$(echo "$c" | jq -r '.line')
                cbody=$(echo "$c" | jq -r '.body')
                FALLBACK="${FALLBACK}\n- **${cpath}:${cline}** — ${cbody}"
              done < <(jq -c '.[]' all_comments.json)

              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg body "$(printf '%b' "$FALLBACK")" '{body: $body}')" \
                "https://api.github.com/repos/$REPO/issues/$PR/comments"
            else
              echo "Review posted successfully"
            fi
          else
            echo "No inline comments — posting summary only"
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$REVIEW_BODY" '{body: $body, event: "COMMENT", comments: []}')" \
              "https://api.github.com/repos/$REPO/pulls/$PR/reviews"
          fi
